<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Campus Bookstore</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shop.css">
</head>
<body>
    <!--
        Error 1 (shop.html, Line 7): rel="stylesheets" has an extra 's'; changed to rel="stylesheet".
        Error 2 (shop.html, Line 10): <style> tag was placed inside <body> instead of <head>; moved styling to shop.css.
        Error 3 (shop.html, Line 18): Inline style used '=' instead of ':' (color=#1B4F72;); fixed syntax and moved to header CSS.
        Error 4 (shop.html, Line 20): Table id="product" did not match #products in shop.css; changed to id="products".
        Error 5 (shop.html, Line 23): Closing tag at the end of the row was <tr> instead of </tr>; fixed to </tr>.
        Error 6 (shop.css, Line 2): Font name typo 'Robotto'; corrected to 'Roboto'.
        Error 7 (shop.css, Line 4): Missing hyphen in 'no repeat'; changed to 'no-repeat'.
        Error 8 (shop.css, Line 5): Property typo 'bacground-position'; corrected to 'background-position'.
        Error 9 (shop.css, Line 18): li a had 'display: inline'; changed to 'display: block' for proper padding.
        Error 10 (shop.css, Line 23): Invalid selector 'li:a:hover'; changed to 'li a:hover'.
        Error 11 (shop.css, Line 27): Invalid value 'border-collapse: collapsed'; changed to 'collapse'.
        Error 12 (shop.css, Line 34): '#products tr:nth-child(2)' only styled row 2; changed to 'nth-child(even)'.
        Error 13 (shop.css, Line 37): Invalid pseudo-class '#products tr:hovered'; changed to ':hover'.
    -->

    <header>
        <h1>Campus Bookstore</h1>
    </header>

    <nav>
        <ul>
            <li><a href="#home" class="active">Home</a></li>
            <li><a href="#books">Books</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Welcome Students</h2>
            <p>Textbooks, stationery and more for every student.</p>

            <table id="products">
                <tr>
                    <th>Item</th>
                    <th>Category</th>
                    <th class="price">Price (RM)</th>
                </tr>
                <tr>
                    <td>Web Design Basics</td>
                    <td>Textbook</td>
                    <td class="price">45.00</td>
                </tr>
                <tr>
                    <td>A4 Notebook</td>
                    <td>Stationery</td>
                    <td class="price">6.50</td>
                </tr>
                <tr>
                    <td>USB Drive 32GB</td>
                    <td>Gadget</td>
                    <td class="price">25.00</td>
                </tr>
                <tr>
                    <td>Highlighter Set</td>
                    <td>Stationery</td>
                    <td class="price">9.00</td>
                </tr>
            </table>
        </section>
    </main>

    <footer>
        &copy; 2026 Campus Bookstore
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Grade Calculator</title>
    <!-- Link external stylesheet (Extension Step 9) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Student Grade Calculator</h2>

        <!-- Fixed Line 9: added 'return' so onsubmit stops page reload -->
        <form name="gradeForm" onsubmit="return checkMark()">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"><br>

            <label for="mark">Mark (0-100):</label>
            <input type="text" id="mark" name="mark"><br>

            <div class="btn-group">
                <button type="submit">Check Grade</button>
                <!-- Extension Step 7: Random Mark button -->
                <button type="button" onclick="generateRandomMark()">Random Mark</button>
            </div>
        </form>

        <!-- Result and timestamp display (Extension Step 8) -->
        <p id="result"></p>
        <p id="checkedTime"></p>

        <!-- Fixed Line 17: corrected 'showtable()' to 'showTable()' -->
        <button type="button" onclick="showTable()">Show Grade Table</button>
        <div id="tableContainer"></div>
    </div>

    <!-- Fixed Line 19: corrected 'grades.js' to 'grade.js' -->
    <script src="grade.js"></script>
</body>
</html>

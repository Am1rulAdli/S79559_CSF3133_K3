<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Quiz Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <header>
            <h1>Web Development Quiz</h1>
            <p>Test your HTML, CSS, and JavaScript knowledge before the timer runs out!</p>
        </header>

        <main>
            <section id="quiz-section">
                <div class="status-bar">
                    <span id="progress">Question 1 of 5</span>
                    <span id="timer">Time Left: 15s</span>
                </div>

                <h2 id="question-text">Question goes here</h2>

                <div id="options-container" class="options-list"></div>

                <div class="controls">
                    <button type="button" id="submit-btn" onclick="checkAnswer()">Submit Answer</button>
                    <button type="button" id="next-btn" onclick="nextQuestion()" disabled>Next Question</button>
                    <button type="button" id="restart-btn" onclick="startQuiz()" class="hidden">Restart Quiz</button>
                </div>
            </section>

            <section id="feedback-section" aria-live="polite"></section>
        </main>

        <footer>
            <p id="score-display">Score: 0 / 5</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>

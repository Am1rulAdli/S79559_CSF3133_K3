<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <!-- Link external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header section with title and instructions -->
        <header>
            <h1>Rock, Paper, Scissors</h1>
            <p>Enter your name, click Start Game, then choose Rock, Paper or Scissors.</p>
        </header>

        <!-- Player name input and Start Game button -->
        <section class="card player-section">
            <label for="playerName">Your name:</label>
            <input type="text" id="playerName" placeholder="Enter your name">
            <button type="button" onclick="startGame()">Start Game</button>
            <p id="welcomeMsg"></p>
        </section>

        <!-- Game controls (with all three images) and battle arena -->
        <section class="card game-section">
            <div class="choice-buttons">
                <button type="button" onclick="playRound('rock')">
                    <img src="rock.png" alt="Rock" class="btn-icon"> Rock
                </button>
                <button type="button" onclick="playRound('paper')">
                    <img src="paper.png" alt="Paper" class="btn-icon"> Paper
                </button>
                <button type="button" onclick="playRound('scissors')">
                    <img src="scissors.png" alt="Scissors" class="btn-icon"> Scissors
                </button>
            </div>

            <div class="arena">
                <div class="fighter">
                    <p>You</p>
                    <img id="playerImg" src="rock.png" alt="Player choice">
                </div>
                <span class="vs-text">VS</span>
                <div class="fighter">
                    <p>Computer</p>
                    <img id="computerImg" src="rock.png" alt="Computer choice">
                </div>
            </div>
        </section>

        <!-- Result message and scoreboard -->
        <section class="card result-section">
            <p id="result"></p>
            <div class="scoreboard">
                <span>Wins: <strong id="wins">0</strong></span>
                <span>Losses: <strong id="losses">0</strong></span>
                <span>Draws: <strong id="draws">0</strong></span>
            </div>
        </section>

        <!-- Round history table and summary/reset controls -->
        <section class="card history-section">
            <h2>History</h2>
            <table id="history">
                <tr>
                    <th>Round</th>
                    <th>You</th>
                    <th>Computer</th>
                    <th>Result</th>
                </tr>
            </table>

            <div class="action-buttons">
                <button type="button" onclick="showSummary()">Show Summary</button>
                <button type="button" onclick="resetGame()">Reset</button>
            </div>
            <p id="summary"></p>
        </section>

        <!-- Footer with game start time and copyright -->
        <footer>
            <p id="startTime"></p>
            <p>&copy; 2026 Computer Science Club</p>
        </footer>
    </div>

    <!-- Link external JavaScript file -->
    <script src="game.js"></script>
</body>
</html>
